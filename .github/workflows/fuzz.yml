name: Fuzz

# 夜間の大きな差分テストと go の fuzz。普段の CI (ci.yml) の `go test ./...` はランダムなプログラムを 30 本 (定数の畳み込みは
# 10 本) しか回さず、go の fuzz は既存の入力で回すだけなので、ここで種を日替わりにして数を増やす。
# 失敗したら、見つかった入力 (testdata/fuzz) を artifact に残す。手で回すときは workflow_dispatch で種と本数を指定できる。

on:
  schedule:
    - cron: "0 18 * * *" # 毎日 03:00 JST
    - cron: "0 20 * * 0" # 日曜 05:00 JST (bugzoo: 直したバグを戻して、テストが見つけるかを測る)
  workflow_dispatch:
    inputs:
      seed:
        description: "乱数の種 (空なら日付)"
        required: false
      randn:
        description: "TestRandomPrograms / TestRandomV3Programs の本数"
        required: false
        default: "1500"

jobs:
  bugzoo:
    # 週 1 回 (と手動): testdata/bugzoo/*.patch を 1 つずつ戻して、各テストが何本で見つけるかの表 (tools/fuzzmeasure)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 20 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install cc65
        run: sudo apt-get update && sudo apt-get install -y cc65

      - name: bugzoo
        run: go run ./tools/fuzzmeasure zoo -randn 300 -foldn 150 | tee bugzoo.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bugzoo
          path: bugzoo.md

  random:
    if: github.event.schedule != '0 20 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install cc65
        run: sudo apt-get update && sudo apt-get install -y cc65

      - name: Random programs (-O 0 / -O 2 / interpreter, self-checks)
        run: |
          SEED="${{ github.event.inputs.seed }}"
          if [ -z "$SEED" ]; then SEED=$(date +%Y%m%d)000; fi
          N="${{ github.event.inputs.randn }}"
          if [ -z "$N" ]; then N=1500; fi
          echo "seed $SEED, n $N"
          FUZZ_STATS=$PWD/fuzz-stats.jsonl go test ./internal/driver -run 'TestRandom' -randn "$N" -foldn 500 -metan 200 -mutn 300 -randseed "$SEED" -timeout 140m

      - name: Upload stats (使った機能と結果。効果の測定)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-stats
          path: fuzz-stats.jsonl

  gofuzz:
    if: github.event.schedule != '0 20 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install cc65
        run: sudo apt-get update && sudo apt-get install -y cc65

      - name: FuzzParse
        run: go test ./internal/syntax -run '^$' -fuzz '^FuzzParse$' -fuzztime 10m

      - name: FuzzFormat
        run: go test ./internal/syntax -run '^$' -fuzz '^FuzzFormat$' -fuzztime 10m

      - name: FuzzCheck
        run: go test ./internal/driver -run '^$' -fuzz '^FuzzCheck$' -fuzztime 20m

      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus
          path: |
            internal/syntax/testdata/fuzz
            internal/driver/testdata/fuzz
